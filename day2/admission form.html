<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKIT College Admission Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#eef2f7;
    padding:30px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#003366;
}

h2{
    margin-top:25px;
    color:#004080;
    border-bottom:2px solid #004080;
    padding-bottom:5px;
}

.form-group{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:20px;
}

.field{
    display:flex;
    flex-direction:column;
}

label{
    font-weight:bold;
    margin-bottom:5px;
}

input,
select,
textarea{
    padding:10px;
    border:1px solid #999;
    border-radius:5px;
    font-size:15px;
}

textarea{
    resize:vertical;
}

.photo{
    text-align:center;
    margin-top:20px;
}

.photo input{
    margin-top:10px;
}

.radio-group{
    display:flex;
    gap:15px;
    margin-top:8px;
}

.buttons{
    text-align:center;
    margin-top:30px;
}

button{
    padding:12px 30px;
    font-size:17px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin:10px;
}

.submit{
    background:#007bff;
    color:white;
}

.reset{
    background:#dc3545;
    color:white;
}

button:hover{
    opacity:0.9;
}

@media(max-width:768px){

.form-group{
grid-template-columns:1fr;
}

}
</style>

</head>

<body>

<div class="container">

<h1>SKIT College Admission Form</h1>
<p style="text-align:center;margin-top:10px;">
Academic Session 2026-27
</p>

<div class="photo">
<h2>Upload Photograph</h2>
<input type="file" accept="image/*">
</div>

<form>

<h2>Personal Details</h2>

<div class="form-group">

<div class="field">
<label>Full Name</label>
<input type="text" required>
</div>

<div class="field">
<label>Father's Name</label>
<input type="text" required>
</div>

<div class="field">
<label>Father's Occupation</label>
<input type="text">
</div>

<div class="field">
<label>Mother's Name</label>
<input type="text">
</div>

<div class="field">
<label>Mother's Occupation</label>
<input type="text">
</div>

<div class="field">
<label>Date of Birth</label>
<input type="date">
</div>

<div class="field">
<label>Caste</label>
<select>
<option>Select</option>
<option>General</option>
<option>OBC</option>
<option>SC</option>
<option>ST</option>
<option>EWS</option>
</select>
</div>

<div class="field">
<label>Gender</label>

<div class="radio-group">

<label><input type="radio" name="gender"> Male</label>

<label><input type="radio" name="gender"> Female</label>

<label><input type="radio" name="gender"> Other</label>

</div>

</div>

<div class="field">
<label>Blood Group</label>

<select>
<option>Select</option>
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>
</select>

</div>

<div class="field">
<label>Annual Family Income</label>
<input type="number">
</div>

<div class="field">
<label>Email</label>
<input type="email">
</div>

<div class="field">
<label>Phone Number</label>
<input type="tel" maxlength="10">
</div>

<div class="field">
<label>Aadhaar Number</label>
<input type="text" maxlength="12">
</div>

<div class="field" style="grid-column:1/3;">
<label>Address</label>
<textarea rows="4"></textarea>
</div>

</div>

<h2>Academic Details</h2>

<div class="form-group">

<div class="field">
<label>Course</label>
<select>
<option>Select Course</option>
<option>B.Tech</option>
<option>M.Tech</option>
<option>MBA</option>
<option>MCA</option>
</select>
</div>

<div class="field">
<label>Branch</label>
<select>
<option>Select Branch</option>
<option>Computer Science Engineering</option>
<option>Artificial Intelligence & Data Science</option>
<option>Information Technology</option>
<option>Electronics & Communication</option>
<option>Electrical Engineering</option>
<option>Mechanical Engineering</option>
<option>Civil Engineering</option>
</select>
</div>

<div class="field">
<label>10th Percentage</label>
<input type="number" step="0.01" placeholder="Example: 92.4">
</div>

<div class="field">
<label>12th Percentage</label>
<input type="number" step="0.01">
</div>

<div class="field">
<label>JEE Score / Percentile</label>
<input type="number" step="0.01">
</div>

<div class="field">
<label>Appeared for JEE?</label>

<div class="radio-group">

<label><input type="radio" name="jee"> Yes</label>

<label><input type="radio" name="jee"> No</label>

</div>

</div>

</div>

<div class="buttons">

<button class="submit" type="submit">
Submit Application
</button>

<button class="reset" type="reset">
Reset Form
</button>

</div>

</form>

</div>

</body>
</html>
</body>
</html>
